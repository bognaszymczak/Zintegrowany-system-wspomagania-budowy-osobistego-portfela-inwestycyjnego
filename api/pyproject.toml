# Ustawienia narzędzi (testy i linter). Zależności aplikacji są w requirements.txt.

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Kod formatuje `ruff format`; długie zdania w komentarzach i opisach po polsku zostawiamy w spokoju (E501).
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# w tests/test_api.py importy idą po pytest.importorskip (plik jest pomijany, gdy nie ma FastAPI/SQLAlchemy)
"tests/test_api.py" = ["E402"]
